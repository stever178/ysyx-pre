extends: [mill.scalalib.ScalaModule]
scalaVersion: 3.7.2
mainClass: Main
mvnDeps:
- org.chipsalliance::chisel:6.5.0
- com.lihaoyi::scalatags:0.13.1
- com.lihaoyi::mainargs:0.7.7
scalacPluginMvnDeps:
- org.chipsalliance:::chisel-plugin:6.5.0
scalacOptions:
- -unchecked
- -deprecation
- -language:reflectiveCalls
- -feature
- -Xcheckinit
- -Xfatal-warnings
- -Ywarn-dead-code
- -Ywarn-unused
- -Ymacro-annotations
